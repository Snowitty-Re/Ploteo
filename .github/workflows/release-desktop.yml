name: Release Desktop Apps

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft
        required: true
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        type: boolean
        default: true
  push:
    tags:
      - v*
      - ploteo-v*

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: ""
            sidecar-target: bun-windows-x64-baseline
            sidecar-output: src-tauri/binaries/ploteo-pi-agent.exe
          - label: macOS Intel
            platform: macos-15-intel
            args: ""
            sidecar-target: bun-darwin-x64
            sidecar-output: src-tauri/binaries/ploteo-pi-agent
          - label: macOS Apple Silicon
            platform: macos-15
            args: ""
            sidecar-target: bun-darwin-arm64
            sidecar-output: src-tauri/binaries/ploteo-pi-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pi Agent sidecar
        run: node scripts/build-pi-sidecar.mjs --target=${{ matrix.sidecar-target }} --outfile=${{ matrix.sidecar-output }}

      - name: Test compiled Pi Agent sidecar
        run: node scripts/test-compiled-sidecar.mjs ${{ matrix.sidecar-output }}

      - name: Build and upload desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'ploteo-v__VERSION__' }}
          releaseName: Ploteo v__VERSION__
          releaseBody: |
            Ploteo desktop beta build.

            Assets include Windows 10/11 x64 installers and macOS Intel / Apple Silicon bundles.
            Windows ARM64 is not built or supported.
            These builds are currently unsigned and not notarized.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          uploadUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}
